[Service]
# Eventlet's greendns resolver bypasses glibc getaddrinfo and so ignores /etc/gai.conf,
# which made outbound broker calls egress over IPv6 (2a02:...) instead of the static IPv4
# whitelisted with Zerodha -- every live order was rejected 403 "IP not allowed"
# (2026-08-03 go-live). Disabling greendns restores the system resolver + gai.conf ordering.
Environment=EVENTLET_NO_GREENDNS=yes
